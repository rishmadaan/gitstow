[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gitstow"
version = "0.7.0"
description = "A git repository library manager — clone, organize, and maintain collections of repos you learn from"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Rish Madaan"},
]
keywords = ["git", "repository", "manager", "cli", "open-source", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
]

dependencies = [
    "typer>=0.9",
    "pyyaml>=6.0",
    "rich>=13.0",
    "beaupy>=3.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://gitstow.com"
Repository = "https://github.com/rishmadaan/gitstow"
Documentation = "https://github.com/rishmadaan/gitstow#readme"
Issues = "https://github.com/rishmadaan/gitstow/issues"
Changelog = "https://github.com/rishmadaan/gitstow/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# ui deps moved into core dependencies (UI is the default experience);
# empty extra kept so old `pip install "gitstow[ui]"` commands still work.
ui = []
dev = [
    "pytest>=8.0",
    "ruff>=0.16",
    "httpx>=0.27",
    "mcp>=1.0",  # server imports both the 1.x and 2.x API
]
mcp = [
    "mcp>=1.0",  # server imports both the 1.x and 2.x API
]

[project.scripts]
gitstow = "gitstow.cli.main:app"
gitstow-mcp = "gitstow.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gitstow"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
ignore = [
    "B008",   # function call in default argument — idiomatic Typer (typer.Option in defaults)
    "DTZ005", # naive datetime.now() — timestamps are deliberately local time for display
    "BLE001", # broad except — bulk runners must survive any single-repo failure
    "S110",   # try-except-pass — deliberate skip-and-continue in discovery sweeps
    "S112",   # try-except-continue — same
]

[tool.ruff.lint.per-file-ignores]
"src/gitstow/cli/main.py" = ["E402"]  # commands deliberately import after the Typer app exists

[tool.pytest.ini_options]
testpaths = ["tests"]
